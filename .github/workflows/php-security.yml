name: "PHP Security & Syntax Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  php-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP Syntax (Linter)
        run: |
          echo "Checking PHP syntax..."
          errors=0
          for file in $(find . -type f -name "*.php" -not -path "./vendor/*"); do
            php -l "$file" > /dev/null 2>&1
            if [ $? -ne 0 ]; then
              echo "Syntax error in $file"
              php -l "$file"
              errors=$((errors+1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "Found $errors file(s) with syntax errors."
            exit 1
          else
            echo "All PHP files passed syntax check successfully!"
          fi

      - name: Run Security Scan
        run: |
          curl -L https://github.com/enlightn/security-checker/releases/latest/download/security-checker.phar -o security-checker.phar
          if [ -f "composer.lock" ]; then
            php security-checker.phar security:check composer.lock
          else
            echo "No composer.lock found. Checking directory directly..."
            php security-checker.phar security:check . || echo "Directory scan completed."
          fi
