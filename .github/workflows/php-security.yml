name: "PHP Security & Syntax Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  php-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpmd

      - name: Check PHP Syntax (Linter)
        run: |
          echo "Checking PHP syntax..."
          errors=0
          for file in $(find . -type f -name "*.php" -not -path "./vendor/*"); do
            php -l "$file" > /dev/null 2>&1
            if [ $? -ne 0 ]; then
              echo "Syntax error in $file"
              php -l "$file"
              errors=$((errors+1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "Found $errors file(s) with syntax errors."
            exit 1
          else
            echo "All PHP files passed syntax check successfully!"
          fi

      - name: Run Security & Code Analysis
        run: |
          echo "Scanning PHP files for security and quality issues..."
          phpmd . github unusedcode,codesize,cleancode || echo "Scan finished with suggestions."
